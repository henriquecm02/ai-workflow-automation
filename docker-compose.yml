# n8n com os 5 workflows importados e ativos na inicialização.
#   GEMINI_API_KEY=... docker compose up
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.47.7
    ports: ["5678:5678"]
    environment:
      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
      # Os fluxos leem a chave por variável de ambiente (ver docs/DECISOES.md sobre credenciais).
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}   # sem chave, os fluxos respondem status "erro_llm"
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-}
    volumes:
      - ./workflows:/workflows:ro
      - ./docker/entrypoint.sh:/entrypoint.sh:ro
      - n8n_data:/home/node/.n8n
    entrypoint: ["sh", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 5s
      retries: 30
volumes:
  n8n_data:
