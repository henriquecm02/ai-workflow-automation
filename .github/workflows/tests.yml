name: tests
on: [push, pull_request]
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Workflows versionados estão em dia com o gerador
        run: |
          python workflows/build.py
          git diff --exit-code -- workflows
      - name: Teste de ponta a ponta (n8n real + Gemini falso)
        run: python tests/e2e.py
      - name: Logs do n8n em caso de falha
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml logs --no-color --tail=200
